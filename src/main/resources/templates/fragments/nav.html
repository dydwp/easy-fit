<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<body>

  <nav th:fragment="nav(page)">
    <div style="width:100%; max-width:1280px; height:100%; margin:0 auto; display:flex; align-items:center; justify-content:space-between; padding:0 24px; box-sizing:border-box;">
      <div class="logo" onclick="location.href='/'">EasyFit</div>
      <div class="nav-links">
        <button class="nav-btn" th:classappend="${page == 'home'} ? ' active' : ''"
                onclick="location.href='/'">홈</button>
        <button class="nav-btn" th:classappend="${page == 'guide'} ? ' active' : ''"
                onclick="location.href='/guide'">운동 가이드</button>
        <button class="nav-btn" th:classappend="${page == 'calendar'} ? ' active' : ''"
                onclick="location.href='/calendar'">캘린더</button>

        <span sec:authorize="isAuthenticated()" style="margin-left:16px; display:inline-flex; align-items:center; gap:10px;">
          <span th:text="${#authentication.principal.user.nickname}" style="opacity:0.8; font-size:14px;"></span>
          <button class="nav-btn" onclick="location.href='/logout'">로그아웃</button>
        </span>
        <span sec:authorize="!isAuthenticated()" style="margin-left:16px;">
          <button class="nav-btn" th:classappend="${page == 'login'} ? ' active' : ''"
                  onclick="location.href='/login'">로그인</button>
        </span>
      </div>
    </div>
  </nav>

</body>
</html>
